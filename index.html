л словаря через фигурные скобки (самый быстрый и частый)
user = {"id": 101, "name": "Alice", "role": "dev"}

# Способ 2: Функция-конструктор dict()
config = dict(host="localhost", port=8080, active=True)

# Способ 3: Dict Comprehension (генератор словаря в одну строку)
squares = {x: x**2 for x in range(6) if x % 2 == 0}
# Результат: {0: 0, 2: 4, 4: 16}`},deepTheory:{title:`Фундаментальная теория: хэш-таблица и неизменяемость ключей`,content:`Внутри Python словарь устроен как хэш-таблица. Когда вы передаете ключ, встроенная функция hash(key) вычисляет целое число, которое указывает номер корзины (bucket) в оперативной памяти.

По этой причине ключ обязан обладать постоянным хэшем на протяжении всей жизни. Строки (str), числа (int, float), булевы значения (bool) и кортежи (tuple) неизменяемы — они идеальные ключи.

Списки (list), словари (dict) и множества (set) являются мутабельными — их содержимое может измениться в любой момент. Если бы список был ключом, то после добавления в него элемента изменился бы хэш, и данные в памяти были бы навсегда потеряны.`,keyPoints:[`Попытка использовать список как ключ вызовет исключение: TypeError: unhashable type: "list".`,`Метод user.get("salary", 0) позволяет безопасно запросить ключ без риска падения программы с KeyError.`,`Для обхода словаря используются методы: .keys() (только ключи), .values() (только значения), .items() (пары ключ-значение).`]},commonMistakes:{title:`Частая ошибка начинающих: прямой доступ по отсутствующему ключу`,badCode:`# ПЛОХО: программа аварийно падает, если ключа нет
salary = user["salary"]  # Вызывает KeyError: 'salary' и останавливает скрипт!`,goodCode:`# ПРАВИЛЬНО: безопасное получение с дефолтным значением
salary = user.get("salary", 0)  # Вернет 0, если ключа нет в словаре`,explanation:`В продакшен-коде данные часто приходят из внешних API или баз данных, где часть полей может отсутствовать. Метод .get() защищает ваш сервис от сбоев.`},codeSnippets:[{title:`Эталонный пример из конспекта`,description:`Литерал, конструктор, безопасное чтение и итерация .items()`,fileName:`dict_basics.py`,code:`# 1. Литерал и конструктор dict()
user = {"id": 101, "name": "Alice", "role": "dev"}
config = dict(host="localhost", port=8080, active=True)

# 2. Безопасное получение и Dict Comprehension
salary = user.get("salary", 0)  # возвращает default=0, исключая KeyError
squares = {x: x**2 for x in range(6) if x % 2 == 0}  # {0: 0, 2: 4, 4: 16}

# 3. Итерация по элементам:
for key, value in user.items():
    print(f"{key} -> {value}")`,explanation:`Цикл for key, value in user.items() распаковывает кортеж из двух элементов прямо в переменные key и value.`}],visualizerType:`hash-map`,practiceTask:{id:`task_dict_1`,title:`Создание словаря и безопасное получение полей`,prompt:`Создайте словарь цен prices = {"apple": 50, "banana": 30}. Получите цену "orange" с дефолтным значением 0 через prices.get(). Затем создайте словарь doubled_prices, где цены всех товаров удвоены с помощью dict comprehension.`,hint:`Используйте {k: v * 2 for k, v in prices.items()}`,initialCode:`prices = {"apple": 50, "banana": 30}

# 1. Получите цену "orange" безопасно:
orange_price = prices.get("orange", 0)

# 2. Создайте словарь doubled_prices с удвоенными ценами:
doubled_prices = {k: v * 2 for k, v in prices.items()}

print("orange_price:", orange_price)
print("doubled_prices:", doubled_prices)`,solutionCode:`prices = {"apple": 50, "banana": 30}
orange_price = prices.get("orange", 0)
doubled_prices = {k: v * 2 for k, v in prices.items()}

print("orange_price:", orange_price)
print("doubled_prices:", doubled_prices)`,testCases:[{description:`orange_price равен 0`,expectedOutput:`orange_price: 0`},{description:`doubled_prices содержит {"apple": 100, "banana": 60}`,expectedOutput:`"apple": 100`}],validate:(e,t)=>e.includes(`.get(`)&&t.includes(`orange_price: 0`)&&t.includes(`100`)?{passed:!0,message:`Отлично! Вы научились создавать словари, использовать .get() и генераторы.`}:{passed:!1,message:`Проверьте: использован ли .get("orange", 0) и удвоены ли цены?`}},quiz:[{id:`q_dict_1`,question:`Какой из следующих объектов НЕ МОЖЕТ быть ключом словаря в Python?`,options:[`Строка "user_id"`,`Целое число 42`,`Список [1, 2, 3]`,`Кортеж ("x", "y")`],correctIndex:2,explanation:`Список [1, 2, 3] изменяем (mutable) и не имеет постоянного хэша, поэтому при попытке сделать список ключом Python вызовет TypeError: unhashable type: "list".`},{id:`q_dict_2`,question:`Что вернет user.get("role", "guest"), если в словаре user уже есть пара "role": "admin"?`,options:[`"admin"`,`"guest"`,`None`,`KeyError`],correctIndex:0,explanation:`Если ключ найден в словаре, метод .get() возвращает его фактическое значение ("admin"). Дефолтное значение возвращается только при отсутствии ключа.`}],interviewTakeaways:[`Средняя сложность поиска, добавления и удаления в dict — O(1).`,`Начиная с Python 3.7, порядок элементов в словаре гарантированно совпадает с порядком их вставки.`,`Для объединения двух словарей в Python 3.9+ используется оператор пайпа: merged = dict1 | dict2.`]},{id:`matrices`,orderNumber:`02`,title:`Матрицы: списки списков vs NumPy ndarray`,shortTitle:`Матрицы и NumPy`,category:`Структуры данных`,summary:`Стандартный Python использует вложенные списки. Для вычислений и линейной алгебры применяется векторный массив numpy.ndarray с компактной непрерывной памятью.`,lifeAnalogy:{title:`Рассыпанные по комнатам коробки vs Лоток для льда`,story:`Список списков в Python — это как цепочка коробок, раскиданных по разным углам квартиры. В первой коробке лежит адрес второй, во второй — адрес третьей. Чтобы прочитать число, процессору приходится прыгать по указателям в памяти. А массив NumPy ndarray — это монолитная форма для льда. Все ячейки лежат строго вплотную друг к другу в одном непрерывном блоке оперативной памяти. Процессор может за один такт загрузить в кэш сразу всю строку матрицы!`,takeaway:`NumPy работает в 10–50 раз быстрее чистого Python за счет непрерывной памяти C и векторных инструкций процессора.`},howToCreate:{title:`Как создать матрицу в Python и в NumPy`,content:`В чистом Python матрицу создают как список, элементами которого являются другие списки. В NumPy используют np.array() или конструкторы np.zeros(), np.ones().`,code:`import numpy as np

# Чистый Python: список списков 2 строки на 3 столбца
py_matrix = [
    [1, 2, 3],
    [4, 5, 6]
]

# NumPy: векторный массив из вложенного списка

обытия.`},howToCreate:{title:`Как записать циклы for и while в Python`,content:`Цикл for перебирает любой итерируемый объект (список, строку, словарь, range). Цикл while требует условия и изменения счетчика внутри тела.`,code:`# 1. Базовый цикл for по списку

оном создавать ручной счетчик i = 0 перед циклом for — используйте enumerate(start=1).`},howToCreate:{title:`Как использовать enumerate() и zip() в коде`,content:`Обе функции возвращают итераторы, которые моментально распаковываются в цикле for в две или три переменные.`,code:`# 1. enumerate(): автоматический счетчик с любого начального числа (start=1)

1. Минимум без выбросов (левый ус).
2. Первый квартиль Q1 (25% данных лежат ниже этой отметки).

4. Третий квартиль Q3 (75% данных).

— это гениальный библиотекарь: он видит участки, которые УЖЕ упорядочены в реальной жизни (runs), и моментально склеивает их!`,takeaway:`Золотое правило: В production-коде ВСЕГДА используйте встроенный sorted() или .sort(), потому что они написаны на Си в ядре CPython и работают в десятки раз быстрее скриптов на Python!`},howToCreate:{title:`Как вызвать встроенную сортировку в Python`,content:`В Python есть два метода: метод списка .sort() (модифицирует список на месте) и встроенная функция sorted() (возвращает новый список).`,code:`scores = [45, 12, 89, 34, 70, 2]

2. Merge Sort (Слияние): Лучшее O(n log n), Среднее O(n log n), Худшее O(n log n), Память O(n). Стабильный.
3. Quick Sort (Быстрая): Лучшее O(n log n), Среднее O(n log n), Худшее O(n²), Память O(log n). НЕстабильный.
4. Timsort (Python): Лучшее O(n), Среднее O(n log n), Худшее O(n log n), Память O(n). Стабильный.

Понятие стабильности: стабильный алгоритм ГАРАНТИРУЕТ, что равные элементы сохранят свой исходный относительный порядок после сортировки.`,keyPoints:[`Timsort был разработан Тимом Петерсом в 2002 году специально для CPython.`,`Флаг swapped в bubble_sort позволяет завершить работу за один проход O(n), если массив уже отсортирован.`]},commonMistakes:{title:`Частая ошибка начинающих: a = a.sort()`,badCode:`# КРИТИЧЕСКАЯ ОШИБКА: метод .sort() возвращает None!

# Либо через sorted():
a = sorted(a)`,explanation:`Метод .sort() мутирует список на месте и возвращает None, чтобы подчеркнуть in-place поведение.`},codeSnippets:[{title:`Готовый модуль скриптов: sorting_algorithms.py`,description:`Полные рабочие реализации Bubble Sort, Merge Sort и Quick Sort из конспекта`,fileName:`sorting_algorithms.py`,code:`def bubble_sort(arr: list) -> list:
    """Сортировка пузырьком с флагом досрочного завершения"""
    a = arr.copy()
    n = len(a)
    for i in range(n):
        swapped = False
        for j in range(0, n - i - 1):
            if a[j] > a[j + 1]:
                a[j], a[j + 1] = a[j + 1], a[j]
                swapped = True
        if not swapped: break
    return a

def merge_sort(arr: list) -> list:
    """Сортировка слиянием (Divide and Conquer)"""
    if len(arr) <= 1: return arr
    mid = len(arr) // 2
    left, right = merge_sort(arr[:mid]), merge_sort(arr[mid:])
    res, i, j = [], 0, 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]: res.append(left[i]); i += 1
        else: res.append(right[j]); j += 1
    res.extend(left[i:]); res.extend(right[j:])
    return res

def quick_sort(arr: list) -> list:
    """Быстрая сортировка с разбиением относительно pivot"""
    if len(arr) <= 1: return arr
    pivot = arr[len(arr) // 2]
    return (quick_sort([x for x in arr if x < pivot]) +
            [x for x in arr if x == pivot] +
            quick_sort([x for x in arr if x > pivot]))`,explanation:`Файл sorting_algorithms.py можно скачать или скопировать в один клик.`}],visualizerType:`sorting-race`,practiceTask:{id:`task_sort_1`,title:`Сортировка массива через sorted()`,prompt:`Дан список scores = [45, 12, 89, 34, 70, 2]. Отсортируйте его по возрастанию asc_scores и по убыванию desc_scores с помощью встроенного sorted().`,hint:`asc_scores = sorted(scores); desc_scores = sorted(scores, reverse=True)`,initialCode:`scores = [45, 12, 89, 34, 70, 2]
